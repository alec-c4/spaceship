name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm exec prettier --check .

      - name: Type Check
        run: pnpm check

      - name: Build
        run: pnpm build

  ci:
    name: CI
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Require the existing CI jobs to succeed
        env:
          JOB_0_RESULT: ${{ needs.build.result }}
        run: |
          test "$JOB_0_RESULT" = success
